name = "neural-network-backend"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "http://localhost:5173"
GOOGLE_REDIRECT_URI = "http://localhost:8787/api/drive/callback"
GOOGLE_LOGIN_REDIRECT_URI = "http://localhost:8787/api/auth/google/callback"
GITHUB_REDIRECT_URI = "http://localhost:8787/api/github/callback"

[env.production.vars]
FRONTEND_URL = "https://neural.cella.website,https://neural-network-3d7.pages.dev,*.neural-network-3d7.pages.dev,*.cella.website"
GOOGLE_REDIRECT_URI = "https://api.neural.cella.website/api/drive/callback"
GOOGLE_LOGIN_REDIRECT_URI = "https://api.neural.cella.website/api/auth/google/callback"
GITHUB_REDIRECT_URI = "https://api.neural.cella.website/api/github/callback"

# Secrets go in .dev.vars (local) or via `wrangler secret put` (production)
# Never put secret values in this file

